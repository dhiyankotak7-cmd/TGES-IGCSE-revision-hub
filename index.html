<title>IGCSE Revision Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: white nav bar, navy search hero, subject card grid; subject pages list units with per-source resource buttons */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#14213a; --muted:#5b6780; --line:#dfe4ec;
  --navy:#0c2246; --navy-fg:#ffffff; --blue:#1767d6; --blue-soft:#e6effc; --yellow:#ffc83d; --yellow-fg:#14213a;
  --bio:#1f9d55; --chem:#e0612a; --phy:#1767d6; --math:#0f8b8d; --bus:#c98a00; --geo:#3a7d2c; --his:#b3412f;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1422; --surface:#151e30; --fg:#e8edf6; --muted:#9aa6bd; --line:#26324a;
  --navy:#0a1a36; --blue:#5b9cf5; --blue-soft:#1a2b4a; --yellow:#ffcf57;
  --bio:#43c47a; --chem:#f08354; --phy:#5b9cf5; --math:#35b8ba; --bus:#e3a92a; --geo:#6cb35a; --his:#e0705d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1422; --surface:#151e30; --fg:#e8edf6; --muted:#9aa6bd; --line:#26324a;
  --navy:#0a1a36; --blue:#5b9cf5; --blue-soft:#1a2b4a; --yellow:#ffcf57;
  --bio:#43c47a; --chem:#f08354; --phy:#5b9cf5; --math:#35b8ba; --bus:#e3a92a; --geo:#6cb35a; --his:#e0705d;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

/* nav */
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:var(--yellow);font-size:15px}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.02em}
.navlinks{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.navlinks a{text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px;color:var(--muted)}
.navlinks a:hover,.navlinks a[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}

/* hero */
.hero{background:var(--navy);color:var(--navy-fg);padding-block:48px 56px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.12;margin:0 0 12px;text-wrap:balance;max-width:18ch}
.hero h1 mark{background:none;color:var(--yellow)}
.hero p{margin:0 0 28px;max-width:58ch;opacity:.85;font-size:17px}
.search{display:flex;background:#fff;border-radius:12px;padding:6px;max-width:620px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.search input{flex:1;min-width:0;border:0;font:inherit;font-size:16px;padding:10px 12px;color:#14213a;background:transparent;outline:none}
.search button{border:0;background:var(--yellow);color:var(--yellow-fg);font:700 15px var(--display);padding:0 20px;border-radius:8px;cursor:pointer}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap;font-size:14px;opacity:.9}
.stats b{font-family:var(--display);font-size:22px;display:block;color:var(--yellow);font-variant-numeric:tabular-nums}

/* sections */
main{padding-block:40px 64px}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(12,34,70,.1);border-color:var(--c)}
.card .top{display:flex;align-items:center;gap:12px}
.ico{width:46px;height:46px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:grid;place-items:center;flex:none}
.ico svg{width:26px;height:26px}
.card h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.2}
.code{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.card .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card .go{margin-top:auto;font-weight:700;font-size:14px;color:var(--c)}

.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:44px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.src h3{font-family:var(--display);margin:0 0 4px;font-size:17px}
.src p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.src a{font-weight:700;color:var(--blue);font-size:14px}

/* subject page */
.crumbs{font-size:14px;color:var(--muted);margin-bottom:16px}
.crumbs a{color:var(--blue);text-decoration:none;font-weight:700}
.shead{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--radius);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.shead .ico{width:58px;height:58px}
.shead .ico svg{width:32px;height:32px}
.shead h1{font-family:var(--display);font-size:clamp(24px,4vw,32px);margin:0;line-height:1.15}
.shead .txt{flex:1;min-width:0}
.shead .links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-family:var(--body)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 14px var(--body);padding:7px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}}

.units{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.unit{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.num{width:40px;height:40px;border-radius:9px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font:800 16px var(--display);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.uname{font-weight:700;font-size:16px}
.uname small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.res a{font-size:13px;font-weight:700;text-decoration:none;padding:6px 11px;border-radius:7px;white-space:nowrap}
.r-notes{background:var(--blue-soft);color:var(--blue)}
.r-q{background:color-mix(in srgb,var(--yellow) 30%,transparent);color:var(--fg)}
.r-stee{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.res a:hover{filter:brightness(.95);text-decoration:underline}
@media (max-width:640px){
  .unit{grid-template-columns:40px minmax(0,1fr)}
  .num{width:34px;height:34px;font-size:14px}
  .res{grid-column:1/-1;justify-content:flex-start}
}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{margin-top:18px;font-size:14px;color:var(--muted)}

/* search results */
.results .unit{grid-template-columns:44px minmax(0,1fr) auto}
.tag{font-size:12px;font-weight:700;color:var(--c)}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

/* password screen */
.pwdscreen{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:999;font-family:var(--body)}
.pwdbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:40px;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(12,34,70,.15)}
.pwdbox h1{font-family:var(--display);font-size:26px;margin:0 0 8px;color:var(--fg)}
.pwdbox p{color:var(--muted);margin:0 0 24px;font-size:15px}
.pwdbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:12px;background:var(--surface);color:var(--fg);font-family:inherit}
.pwdbox input:focus{outline:none;border-color:var(--blue)}
.pwdbox button{width:100%;padding:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}
.pwdbox button:hover{filter:brightness(1.08)}
.pwdbox .error{color:#e85d5d;font-size:14px;margin-top:12px}
.pwdscreen.hidden{display:none}
</style>

<div class="pwdscreen" id="pwdscreen">
  <div class="pwdbox">
    <h1>IGCSE Hub</h1>
    <p>Enter password to access</p>
    <input id="pwdinput" type="password" placeholder="Password" autocomplete="off">
    <button id="pwdbtn">Unlock</button>
    <div class="error" id="pwderr"></div>
  </div>
</div>

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cvar = s => `--c:var(--${s.key})`;
const ext = (href, cls, label) => href ? `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${label}</a>` : "";
const totalUnits = SUBJECTS.reduce((n, s) => n + s.units.length, 0);
const totalFolders = SUBJECTS.reduce((n, s) => n + s.units.reduce((m, u) => m + u.slice(1).filter(Boolean).length, 0), 0);

function nav(active){
  $("#navlinks").innerHTML = `<a href="#home"${active==="home"?' aria-current="page"':""}>All subjects</a>` +
    SUBJECTS.map(s => `<a href="#${s.slug}"${active===s.slug?' aria-current="page"':""}>${esc(s.name.replace("International ",""))}</a>`).join("");
}

function unitRow(s, u, i, filter, showSubject){
  const [name, rm, tq, st] = u;
  const links = [
    (filter==="all"||filter==="notes") && ext(D(rm), "r-notes", "Revision notes"),
    (filter==="all"||filter==="questions") && ext(D(tq), "r-q", "Topic questions"),
    (filter==="all"||filter==="stee") && ext(D(st), "r-stee", "STEE notes")
  ].filter(Boolean).join("");
  if (!links) return "";
  return `<div class="unit" style="${cvar(s)}"><span class="num">${i+1}</span>
    <div class="uname">${showSubject?`<span class="tag">${esc(s.name)} · ${s.code}</span><br>`:""}${esc(name)}</div>
    <div class="res">${links}</div></div>`;
}

function home(){
  nav("home");
  $("#app").innerHTML = `
  <section class="hero"><div class="wrap">
    <h1>Every IGCSE resource, <mark>one click away</mark></h1>
    <p>Revision notes, topic questions and STEE notes for all seven subjects, sorted by syllabus unit and linked straight to the Drive folders.</p>
    <form class="search" id="searchform" role="search">
      <label for="q" hidden>Search topics</label>
      <input id="q" type="search" placeholder="Search a topic, e.g. Enzymes, Tectonic Hazards, Vectors" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div class="stats"><div><b>${SUBJECTS.length}</b>subjects</div><div><b>${totalUnits}</b>syllabus units</div><div><b>${totalFolders}</b>resource folders</div><div><b>3</b>sources</div></div>
  </div></section>
  <main><div class="wrap">
    <div id="results"></div>
    <div id="homebody">
      <h2>Choose a subject</h2>
      <p class="sub">Cambridge IGCSE, organised by syllabus unit.</p>
      <div class="grid">${SUBJECTS.map(s => {
        const st = s.units.filter(u => u[3]).length;
        return `<a class="card" href="#${s.slug}" style="${cvar(s)}">
          <div class="top"><span class="ico">${ICONS[s.key]}</span><div><h3>${esc(s.name)}</h3><span class="code">CAIE ${s.code}</span></div></div>
          <div class="meta"><span class="pill">${s.units.length} units</span><span class="pill">Notes</span><span class="pill">Questions</span>${st?`<span class="pill">STEE</span>`:""}</div>
          <span class="go">Open ${esc(s.name.replace("International ",""))} →</span></a>`;}).join("")}
      </div>
      <div class="sources">
        <div class="src"><h3>Save My Exams</h3><p>Revision notes and topic-wise exam questions, split by unit and sub-topic.</p>${ext(D(SRC.sme),"","Open folder →")}</div>
        <div class="src"><h3>STEE</h3><p>Unit notes for Biology, Chemistry, Physics, Geography, History and Business.</p>${ext(D(SRC.stee),"","Open folder →")}</div>
        <div class="src"><h3>r/IGCSE</h3><p>Community notes from the r/IGCSE resource repository (Biology, Physics, History).</p>${ext(D(SRC.r),"","Open folder →")}</div>
        <div class="src"><h3>Whole collection</h3><p>Every subject and source in one Google Drive library.</p>${ext(D(ROOT),"","Open folder →")}</div>
      </div>
    </div>
  </div></main>`;
  const form = $("#searchform"), q = $("#q");
  const run = () => search(q.value.trim());
  form.addEventListener("submit", e => { e.preventDefault(); run(); });
  q.addEventListener("input", run);
}

function search(term){
  const box = $("#results"), body = $("#homebody");
  if (!term){ box.innerHTML = ""; body.hidden = false; return; }
  const t = term.toLowerCase();
  const hits = [];
  SUBJECTS.forEach(s => s.units.forEach((u, i) => {
    if (u[0].toLowerCase().includes(t) || s.name.toLowerCase().includes(t) || s.code === t) hits.push([s, u, i]);
  }));
  body.hidden = true;
  box.innerHTML = `<h2>${hits.length} result${hits.length===1?"":"s"} for “${esc(term)}”</h2><p class="sub">Clear the search box to see all subjects.</p>` +
    (hits.length ? `<div class="units results">${hits.map(([s,u,i]) => unitRow(s,u,i,"all",true)).join("")}</div>`
                 : `<div class="units"><div class="empty">No unit matches that. Try a shorter word, like “energy” or “cells”.</div></div>`);
}

let filter = "all";
function subject(s){
  nav(s.slug);
  const hasStee = s.units.some(u => u[3]);
  const draw = () => {
    const rows = s.units.map((u,i) => unitRow(s,u,i,filter,false)).join("");
    $("#unitlist").innerHTML = rows || `<div class="empty">No units have this resource type yet.</div>`;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.f === filter));
  };
  $("#app").innerHTML = `<main><div class="wrap">
    <div class="crumbs"><a href="#home">IGCSE</a> / ${esc(s.name)}</div>
    <div class="shead" style="${cvar(s)}">
      <span class="ico">${ICONS[s.key]}</span>
      <div class="txt"><span class="code">CAMBRIDGE IGCSE · ${s.code}</span><h1>${esc(s.name)}</h1></div>
      <div class="links">
        ${ext(D(s.rm),"btn primary","All revision notes")}
        ${ext(D(s.twq),"btn","All topic questions")}
        ${ext(D(s.stee),"btn","STEE folder")}
        ${ext(D(s.r),"btn","r/IGCSE notes")}
      </div>
    </div>
    <div class="filters" role="group" aria-label="Filter resources"><span>Show</span>
      <button class="chip" id="f-all" data-f="all">Everything</button>
      <button class="chip" id="f-notes" data-f="notes">Revision notes</button>
      <button class="chip" id="f-questions" data-f="questions">Topic questions</button>
      ${hasStee?`<button class="chip" id="f-stee" data-f="stee">STEE notes</button>`:""}
    </div>
    <div class="units" id="unitlist"></div>
    <p class="note">Each unit folder contains sub-topic folders (for example 3.1, 3.2) with the PDFs inside. Links open in Google Drive in a new tab.</p>
  </div></main>`;
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    filter = c.dataset.f; try{ localStorage.setItem("igcse-filter", filter); }catch(e){}
    draw();
  }));
  draw();
}

try{ const f = localStorage.getItem("igcse-filter"); if (f) filter = f; }catch(e){}

// password protection (change PASSWORD value to your chosen password)
const PASSWORD = "revision";
function initPassword(){
  const pwd = $("#pwdinput"), err = $("#pwderr"), screen = $("#pwdscreen"), btn = $("#pwdbtn");
  const check = () => {
    if (pwd.value === PASSWORD){ try{ localStorage.setItem("igcse-auth", "1"); }catch(e){}
      screen.classList.add("hidden"); route(); } else { err.textContent = "Wrong password"; pwd.value = ""; pwd.focus(); }};
  btn.addEventListener("click", check);
  pwd.addEventListener("keypress", e => { if (e.key === "Enter") check(); });
  try{ if (localStorage.getItem("igcse-auth") === "1"){ screen.classList.add("hidden"); } }catch(e){}
}
initPassword();

function route(){
  const slug = (location.hash || "#home").slice(1);
  const s = SUBJECTS.find(x => x.slug === slug);
  if (s){ if (filter==="stee" && !s.units.some(u=>u[3])) filter="all"; subject(s); } else home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
try{ if (localStorage.getItem("igcse-auth") === "1"){ route(); } }catch(e){ route(); }
</script>
